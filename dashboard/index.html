<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Coffee Shop SKU 销量预测验证台</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root {
  --bg: #0f1117; --card: #1a1d27; --border: #2a2d37; --text: #e4e6eb;
  --text2: #8b8fa3; --accent: #6366f1; --accent2: #22c55e; --err: #ef4444;
  --warn: #f59e0b; --coffee: #8B5E3C; --tea: #4ade80; --bakery: #fbbf24;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,system-ui,sans-serif; line-height:1.6; overflow-x:hidden; }
.container { max-width:1280px; margin:0 auto; padding:0 24px; }

/* Hero */
.hero { padding:60px 0 40px; text-align:center; border-bottom:1px solid var(--border); margin-bottom:32px; }
.hero h1 { font-size:2.2rem; margin-bottom:8px; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.hero p { color:var(--text2); font-size:1.05rem; max-width:600px; margin:0 auto; }

/* Tabs */
.tabs { display:flex; gap:4px; margin-bottom:20px; flex-wrap:wrap; }
.tab { padding:8px 18px; background:var(--card); border:1px solid var(--border); color:var(--text2); border-radius:8px; cursor:pointer; font-size:0.9rem; transition:all .2s; }
.tab:hover { border-color:var(--accent); color:var(--text); }
.tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }

/* Cards */
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; margin-bottom:24px; }
.card h2 { font-size:1.2rem; margin-bottom:16px; color:var(--text); }
.card h3 { font-size:1rem; margin:12px 0 8px; color:var(--text2); }

/* Metrics */
.metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-bottom:24px; }
.metric { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; text-align:center; }
.metric .value { font-size:1.4rem; font-weight:700; }
.metric .label { font-size:0.8rem; color:var(--text2); margin-top:4px; }
.metric.accent .value { color:var(--accent); }
.metric.good .value { color:var(--accent2); }

/* Chart wrappers */
.chart-wrap { position:relative; height:340px; margin:8px 0; }
.chart-wrap.large { height:420px; }
.chart-wrap canvas { width:100%!important; }

/* Feature grid */
.fi-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
.fi-item { background:#252836; border-radius:8px; padding:12px 16px; display:flex; align-items:center; gap:12px; min-width:0; }
.fi-rank { font-size:0.75rem; color:var(--text2); min-width:24px; }
.fi-bar-bg { flex:1; height:8px; background:#393c4f; border-radius:4px; overflow:hidden; }
.fi-bar { height:100%; border-radius:4px; background:var(--accent); }
.fi-pct { font-size:0.8rem; color:var(--text2); min-width:50px; text-align:right; }
.fi-name { font-size:0.85rem; flex:1; min-width:0; overflow-wrap:anywhere; }

/* Chat */
.chat-log { max-height:380px; overflow-y:auto; margin-bottom:16px; display:flex; flex-direction:column; gap:12px; }
.chat-msg { padding:12px 16px; border-radius:10px; font-size:0.9rem; line-height:1.6; max-width:90%; }
.chat-msg.user { background:var(--accent); color:#fff; align-self:flex-end; }
.chat-msg.bot { background:#252836; color:var(--text); align-self:flex-start; }
.chat-msg.system { background:transparent; color:var(--text2); font-size:0.8rem; align-self:center; text-align:center; }
.chat-input-row { display:flex; gap:8px; }
.chat-input-row input { flex:1; padding:10px 14px; background:#252836; border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:0.9rem; }
.chat-input-row input:focus { outline:none; border-color:var(--accent); }
.chat-input-row button { padding:10px 20px; background:var(--accent); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:0.9rem; }
.chat-input-row button:disabled { opacity:0.5; cursor:not-allowed; }

/* Select dropdown */
.lvl-select { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.lvl-select select { padding:6px 12px; background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:6px; font-size:0.85rem; }
.lvl-select label { font-size:0.85rem; color:var(--text2); }

/* Mobile */
@media (max-width:768px) { .hero h1 { font-size:1.6rem; } .metrics { grid-template-columns:1fr 1fr; } .fi-grid { grid-template-columns:1fr; } }

/* Loading */
.spinner { display:inline-block; width:16px; height:16px; border:2px solid transparent; border-top-color:#fff; border-radius:50%; animation:spin .6s linear infinite; margin-right:6px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Section spacing */
.section-title { font-size:1.4rem; margin:40px 0 16px; padding-bottom:8px; border-bottom:2px solid var(--accent); display:inline-block; }

pre { background:#252836; padding:16px; border-radius:8px; overflow-x:auto; font-size:0.85rem; }
code { font-size:0.85rem; background:#252836; padding:2px 6px; border-radius:4px; }
#method-content { max-width:100%; overflow-x:auto; }

.error-banner { background:#451a1a; border:1px solid var(--err); border-radius:8px; padding:12px 16px; color:#fca5a5; font-size:0.85rem; margin:12px 0; }
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="hero">
    <h1>Coffee Shop SKU 销量预测验证台</h1>
    <p id="validation-scope">正在加载最近一次可信验证结果...</p>
  </div>

  <!-- Key Metrics -->
  <div class="metrics" id="metrics">
    <div class="metric good"><div class="value" id="m-r2">--</div><div class="label">SKU 级 R²</div></div>
    <div class="metric accent"><div class="value" id="m-mae">--</div><div class="label">MAE (杯/SKU)</div></div>
    <div class="metric"><div class="value" id="m-rmse">--</div><div class="label">RMSE (杯/SKU)</div></div>
    <div class="metric"><div class="value" id="m-p10">--</div><div class="label">±10% 命中率</div></div>
    <div class="metric"><div class="value" id="m-p20">--</div><div class="label">±20% 命中率</div></div>
    <div class="metric"><div class="value" id="m-samples">--</div><div class="label">验证样本</div></div>
  </div>

  <!-- === SECTION 1: Predictions Chart === -->
  <div class="card">
    <h2>预测 vs 实际销量</h2>
    <div class="lvl-select">
      <label>预测层级：</label>
      <select id="lvl-select" onchange="switchLevel()">
        <option value="daily">日总量</option>
        <option value="store">门店</option>
        <option value="category">品类</option>
        <option value="type">子类型</option>
      </select>
      <select id="lvl-entity" style="display:none;"></select>
    </div>
    <div class="chart-wrap large"><canvas id="chartPred"></canvas></div>
  </div>

  <!-- === SECTION 2: Feature Importance === -->
  <div class="card">
    <h2>SHAP 特征重要性</h2>
    <p style="color:var(--text2);font-size:0.9rem;margin-bottom:12px;">
      当前训练模型的 TreeSHAP 绝对贡献均值，单位为杯。历史销量特征均严格滞后，<code>sku_share_28d</code> 仅使用预测日前 28 天数据。
    </p>
    <div class="fi-grid" id="fi-grid"></div>
    <p style="color:var(--text2);font-size:0.75rem;margin-top:8px;" id="fi-note"></p>
  </div>

  <!-- === SECTION 3: Methodology === -->
  <div class="card" id="method-card">
    <h2>方法原理</h2>
    <p style="color:var(--text2);margin-bottom:12px;">以下内容由系统生成，全面介绍模型架构与预测流程。</p>
    <div id="method-content"></div>
  </div>

  <!-- === SECTION 4: Error Table === -->
  <div class="card">
    <h2>预测偏差 Top 10</h2>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:0.9rem;">
        <thead><tr style="text-align:left;border-bottom:1px solid var(--border);"><th style="padding:8px">日期</th><th style="padding:8px">门店</th><th style="padding:8px">品类</th><th style="padding:8px">子类型</th><th style="padding:8px">实际</th><th style="padding:8px">预测</th><th style="padding:8px">偏差</th></tr></thead>
        <tbody id="err-table"></tbody>
      </table>
    </div>
  </div>

  <p style="text-align:center;color:var(--text2);font-size:0.8rem;padding:32px 0;">
    <span id="model-footer">加载模型信息...</span>
  </p>
</div>

<script>
// ==================== DATA ====================
let DATA = {};
let activeLevel = 'daily';
let activeEntity = '';
let charts = {};

async function loadData() {
  const r = await fetch('data.json');
  DATA = await r.json();
  init();
}

// ==================== METRICS ====================
function computeMetrics() {
  const metrics = DATA.metrics;
  const metadata = DATA.metadata;
  document.getElementById('m-r2').textContent = metrics.r2.toFixed(3);
  document.getElementById('m-mae').textContent = metrics.mae.toFixed(2);
  document.getElementById('m-rmse').textContent = metrics.rmse.toFixed(2);
  document.getElementById('m-p10').textContent = `${metrics.within_10pct.toFixed(1)}%`;
  document.getElementById('m-p20').textContent = `${metrics.within_20pct.toFixed(1)}%`;
  document.getElementById('m-samples').textContent = metadata.sample_count.toLocaleString();
  document.getElementById('validation-scope').textContent =
    `${metadata.validation_start} 至 ${metadata.validation_end} · ${metadata.validation_days} 天单次留出验证 · ` +
    `${metadata.sample_count.toLocaleString()} 个门店 × SKU × 日样本`;
  document.getElementById('model-footer').textContent =
    `${metadata.model_name} · ${metadata.feature_count} 个特征 · 单次 7 天留出验证，不代表生产精度`;
}

// ==================== CHARTS ====================
const COLORS = {
  actual: '#6366f1', pred: '#22c55e', diff: '#f59e0b',
  stores: ['#6366f1','#22c55e','#f59e0b'],
  cats: ['#6366f1','#22c55e','#f59e0b','#ef4444','#ec4899','#8b5cf6','#3b82f6','#06b6d4','#84cc16'],
};

function chartPred() {
  if (charts.pred) charts.pred.destroy();
  const ctx = document.getElementById('chartPred').getContext('2d');
  
  let labels, actuals, preds;
  if (activeLevel === 'daily') {
    const d = DATA.daily_predictions;
    labels = d.map(x => x.date.slice(5));
    actuals = d.map(x => x.actual);
    preds = d.map(x => x.pred);
  } else {
    const src = activeLevel === 'store' ? DATA.store_predictions :
                activeLevel === 'category' ? DATA.category_predictions :
                DATA.type_predictions;
    const allEntities = Object.keys(src);
    if (!activeEntity) activeEntity = allEntities[0];
    updateEntitySelect(allEntities);
    const ent = src[activeEntity];
    labels = ent.dates.map(x => x.slice(5));
    actuals = ent.actual;
    preds = ent.pred;
  }
  
  // Diff
  const diffs = actuals.map((a,i) => a - preds[i]);
  
  charts.pred = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label:'误差 (杯)', data:diffs, backgroundColor:diffs.map(d=>d>0?'rgba(99,102,241,0.4)':'rgba(239,68,68,0.4)'), borderColor:'transparent', yAxisID:'y1', order:1 },
        { label:'实际销量', data:actuals, backgroundColor:'transparent', borderColor:COLORS.actual, borderWidth:2.5, pointRadius:5, pointBackgroundColor:COLORS.actual, tension:0.3, type:'line', order:0 },
        { label:'预测销量', data:preds, backgroundColor:'transparent', borderColor:COLORS.pred, borderWidth:2.5, borderDash:[6,3], pointRadius:4, pointBackgroundColor:COLORS.pred, tension:0.3, type:'line', order:0 },
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${ctx.raw.toFixed(0)} 杯`}},
        legend:{labels:{color:'#8b8fa3',usePointStyle:true,pointStyle:'circle',padding:20}}
      },
      scales:{
        y:{title:{display:true,text:'杯数',color:'#8b8fa3'},grid:{color:'#2a2d37'},ticks:{color:'#8b8fa3'}},
        y1:{position:'right',title:{display:true,text:'偏差 (杯)',color:'#8b8fa3'},grid:{display:false},ticks:{color:'#8b8fa3'}},
        x:{grid:{display:false},ticks:{color:'#8b8fa3'}}
      }
    }
  });
}

function updateEntitySelect(entities) {
  const sel = document.getElementById('lvl-entity');
  sel.style.display = 'inline';
  sel.innerHTML = entities.map(e => `<option value="${e}">${e}</option>`).join('');
  sel.value = activeEntity;
  sel.onchange = () => { activeEntity = sel.value; chartPred(); };
}

function switchLevel() {
  activeLevel = document.getElementById('lvl-select').value;
  activeEntity = '';
  const sel = document.getElementById('lvl-entity');
  if (activeLevel === 'daily') { sel.style.display='none'; }
  else {
    const src = activeLevel==='store'?DATA.store_predictions:
                activeLevel==='category'?DATA.category_predictions:
                DATA.type_predictions;
    activeEntity = Object.keys(src)[0];
  }
  chartPred();
}

// ==================== FEATURE IMPORTANCE ====================
function renderGlobalFI() {
  const grid = document.getElementById('fi-grid');
  const items = DATA.feature_importance;
  if (!items || !items.length) { grid.innerHTML = '<p style="color:var(--text2)">无数据</p>'; return; }
  const max = items[0]?.importance || 1;
  grid.innerHTML = items.map((f,i) => {
    const w = Math.max(1, (f.importance / max * 100));
    const cm = {时序:'#6366f1',天气:'#06b6d4',日历:'#22c55e',节假日:'#f59e0b',品类:'#ec4899','品类/价格':'#ec4899'};
    const color = cm[f.category] || '#8b5cf6';
    return `<div class="fi-item">
      <span class="fi-rank">#${i+1}</span>
      <span class="fi-name" title="${f.feature}">${f.feature}</span>
      <div class="fi-bar-bg"><div class="fi-bar" style="width:${w}%;background:${color}"></div></div>
      <span class="fi-pct">${f.importance.toFixed(4)}</span>
    </div>`;
  }).join('');
  document.getElementById('fi-note').textContent = DATA.shap_note || 'TreeSHAP — 特征对预测的期望贡献（SHAP绝对值均值）';
}

function renderFI() {
  renderGlobalFI();
}

// ==================== ERROR TABLE ====================
function renderErrTable() {
  const tb = document.getElementById('err-table');
  tb.innerHTML = DATA.top_errors.map(e => `
    <tr style="border-bottom:1px solid var(--border)">
      <td style="padding:8px">${e.date.slice(0,10)}</td>
      <td style="padding:8px">${e.store}</td>
      <td style="padding:8px">${e.category}</td>
      <td style="padding:8px">${e.type}</td>
      <td style="padding:8px">${e.actual}</td>
      <td style="padding:8px">${e.pred}</td>
      <td style="padding:8px;color:${e.error>0?'var(--accent2)':'var(--err)'}">${e.error>0?'+':''}${e.error}</td>
    </tr>
  `).join('');
}

// ==================== METHODOLOGY ====================
function renderMethod() {
  const metadata = DATA.metadata;
  const metrics = DATA.metrics;
  const content = `
### 整体架构：Global LightGBM

当前实现使用官方 lightgbm 包的 LGBMRegressor，以一个全局模型处理所有门店和 SKU。

#### 特征工程（44 个特征，五梯队）

| 梯队 | 类别 | 特征数 | 代表特征 |
|------|------|:---:|------|
| 第一梯队 | 时序销量 | 14 | lag_1/2/3/7/14/28, rolling_mean/std 7/14/28d, dow_avg |
| 第二梯队 | 日历基础 | 7 | day_of_week, is_weekend, day_of_month, week_of_month |
| 第三梯队 | 天气 | 13 | 最高/最低/均温, 降水量, 是否下雨/雪/晴, 日照, 湿度 |
| 第四梯队 | 节假日 | 5 | 13种节日详情, 节前1天/3天, 节后1天, 长周末 |
| 第五梯队 | 品类/价格 | 2 | 价格相对品类均值, 前 28 天历史 SKU 占比 |

#### 训练策略
- **诊断交叉验证**：TimeSeriesSplit (n_splits=3)
- **训练/测试**：前 174 天训练 (01/01-06/23)，最后 7 天测试 (06/24-06/30)
- **集成**：HGB 权重 0.6 + GB 权重 0.4
- **泄露防护**：所有标签衍生特征至少滞后 1 天，\`sku_share_28d\` 仅使用历史数据

#### 当前可信验证结果
| 范围 | 样本 | R² | MAE | RMSE | ±10% | ±20% |
|------|------:|---:|----:|-----:|-----:|-----:|
| ${metadata.validation_start} 至 ${metadata.validation_end} | ${metadata.sample_count.toLocaleString()} | ${metrics.r2.toFixed(3)} | ${metrics.mae.toFixed(2)} | ${metrics.rmse.toFixed(2)} | ${metrics.within_10pct.toFixed(1)}% | ${metrics.within_20pct.toFixed(1)}% |

#### 可解释性
- TreeSHAP 已通过加法校验，当前图表展示全局绝对贡献均值
- 该聚合只表示模型依赖程度，不代表因果关系
- 逐预测带符号 SHAP 尚未持久化，因此页面不展示伪造的逐日根因

> 限制：这只是单个 7 天留出窗口，不可用于宣称生产精度。后续需要多个滚动 7 天窗口和朴素基线对照。
`;
  document.getElementById('method-content').innerHTML = marked.parse(content);
}

// ==================== INIT ====================
function init() {
  computeMetrics();
  chartPred();
  renderFI();
  renderErrTable();
  renderMethod();
}

loadData();
</script>
</body>
</html>
